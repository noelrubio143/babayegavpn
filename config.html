<!DOCTYPE html>
<html>
<head><title>Babayega VPN Configs</title></head>
<body>
  <h1>Server Configs</h1>
  <p>
    Ito ang page na binabasa ng app (RemoteConfigFetcher). Wag alisin yung
    &lt;script&gt; tag sa baba — doon lang tumitingin ang app. Dagdag/bawas/palit
    ka lang ng entries sa loob ng array. Bawat protocol na suportado ng
    "Custom Config" screen mo ay may isang halimbawa dito.
  </p>

  <script type="application/json" id="babayega-configs">
  [
    {
      "_comment": "1) SSH DIRECT - serverType 1",
      "Name": "SSH Direct 1",
      "Info": "Free SSH Direct",
      "Flag": "ph",
      "Custom": true,
      "serverType": 1,
      "ServerHost": "123.45.67.89",
      "ServerPort": "22",
      "Username": "user1",
      "Password": "pass1"
    },
    {
      "_comment": "2) SSH PROXY - serverType 2 (needs ProxyHost/ProxyPort)",
      "Name": "SSH Proxy 1",
      "Info": "SSH via Proxy",
      "Flag": "ph",
      "Custom": true,
      "serverType": 2,
      "ServerHost": "123.45.67.89",
      "ServerPort": "22",
      "Username": "user1",
      "Password": "pass1",
      "ProxyHost": "proxy.example.com",
      "ProxyPort": "80",
      "Payload": ""
    },
    {
      "_comment": "3) SSH SSL - serverType 3 (always include ServerHost or it will be misread as V2Ray)",
      "Name": "SSH SSL 1",
      "Info": "SSH over SSL",
      "Flag": "ph",
      "Custom": true,
      "serverType": 3,
      "ServerHost": "123.45.67.89",
      "ServerPort": "443",
      "Username": "user1",
      "Password": "pass1",
      "SNI": "yourdomain.com"
    },
    {
      "_comment": "4) PAY SSL - serverType 4",
      "Name": "Pay SSL 1",
      "Info": "Premium SSL",
      "Flag": "ph",
      "Custom": true,
      "serverType": 4,
      "ServerHost": "123.45.67.89",
      "ServerPort": "443",
      "Username": "user1",
      "Password": "pass1",
      "Payload": "",
      "SNI": "yourdomain.com"
    },
    {
      "_comment": "5) UDP - serverType 6",
      "Name": "UDP Server 1",
      "Info": "UDP tunnel",
      "Flag": "ph",
      "Custom": true,
      "serverType": 6,
      "ServerHost": "123.45.67.89",
      "ServerPort": "53",
      "Username": "user1",
      "Password": "pass1"
    },
    {
      "_comment": "6) SLOWDNS / dnstt - serverType 5",
      "Name": "SlowDNS 1",
      "Info": "dnstt tunnel",
      "Flag": "ph",
      "Custom": true,
      "serverType": 5,
      "ServerHost": "123.45.67.89",
      "ServerPort": "22",
      "Username": "user1",
      "Password": "pass1",
      "DNSServer": "8.8.8.8",
      "PublicKey": "your_dnstt_public_key_here",
      "Nameserver": "ns.yourdomain.com"
    },
    {
      "_comment": "7) SLIPSTREAM - serverType 8",
      "Name": "Slipstream 1",
      "Info": "Slipstream tunnel",
      "Flag": "ph",
      "Custom": true,
      "serverType": 8,
      "Domain": "yourdomain.com",
      "Resolver": "8.8.8.8",
      "Authoritative": "ns.yourdomain.com",
      "Cert": "",
      "Congestion": "",
      "KeepAlive": "",
      "Username": "user1",
      "Password": "pass1"
    },
    {
      "_comment": "8a) V2RAY/XRAY via raw link (vmess/vless/trojan/ss)",
      "Name": "Xray Link 1",
      "Info": "Xray/V2Ray (link)",
      "Flag": "sg",
      "Custom": true,
      "v2ray": "vmess://PASTE_YOUR_FULL_LINK_HERE"
    },
    {
      "_comment": "8b) V2RAY/XRAY via full JSON config instead of a link",
      "Name": "Xray Config 1",
      "Info": "Xray/V2Ray (full JSON)",
      "Flag": "sg",
      "Custom": true,
      "ConfigJson": "PASTE_YOUR_FULL_V2RAY_JSON_CONFIG_HERE_AS_ONE_STRING"
    }
  ]
  </script>
</body>
</html>
